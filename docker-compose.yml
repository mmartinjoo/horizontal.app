services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "9999:8000"
    volumes:
      - ./api:/var/www
      - ./api/storage:/var/www/storage
      - /var/www/vendor  # Anonymous volume for vendor to avoid host conflicts
      - /var/www/node_modules  # Anonymous volume for node_modules
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
#      interval: 30s
#      timeout: 5s
#      retries: 3
#      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      memgraph-tenant1:
        condition: service_started
      memgraph-tenant2:
        condition: service_started
    command: >
      sh -c "
        sleep 10 &&
        composer install &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

  worker-indexing:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 4
    volumes:
      - ./api:/var/www
      - ./api/storage:/var/www/storage
      - /var/www/vendor
      - /var/www/node_modules
    depends_on:
      db:
        condition: service_healthy
      memgraph-tenant1:
        condition: service_started
      memgraph-tenant2:
        condition: service_started
    command: >
      sh -c "
        sleep 10 &&
        composer install &&
        php artisan queue:listen --timeout=1800 --queue=indexing,default
      "

  worker-default:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./api:/var/www
      - ./api/storage:/var/www/storage
      - /var/www/vendor
      - /var/www/node_modules
    depends_on:
      db:
        condition: service_healthy
      memgraph-tenant1:
        condition: service_started
      memgraph-tenant2:
        condition: service_started
    command: >
      sh -c "
        sleep 10 &&
        composer install &&
        php artisan queue:listen --timeout=1800 --queue=default,indexing
      "

  db:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_DB=horizontal
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "54320:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d horizontal"]
      interval: 10s
      timeout: 5s
      retries: 5

#  frontend:
#    build:
#      context: ./frontend
#      dockerfile: Dockerfile
#    ports:
#      - "51730:5173"
#    volumes:
#      - ./frontend:/app
#      - /app/node_modules
#    environment:
#      - VITE_API_URL=http://localhost:8000
#    depends_on:
#      - api
#
  graphbuilder-api:
    build:
      context: ./graphbuilder
      dockerfile: Dockerfile
      target: api
    ports:
      - "9998:9998"
    volumes:
      - ./graphbuilder:/app
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      memgraph-tenant1:
        condition: service_started
      memgraph-tenant2:
        condition: service_started

  graphbuilder-worker:
    build:
      context: ./graphbuilder
      dockerfile: Dockerfile
      target: worker
    deploy:
      replicas: 4
    restart: unless-stopped
    volumes:
      - ./graphbuilder:/app
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      redis:
        condition: service_healthy
      memgraph-tenant1:
        condition: service_started
      memgraph-tenant2:
        condition: service_started

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "63791:6379"
    volumes:
      - ./redisdata:/data

  memgraph-tenant1:
    image: memgraph/memgraph-mage:latest
    volumes:
      - memgraph_tenant1_data:/var/lib/memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    command: [ "--log-level=TRACE" ]
    environment:
      - MEMGRAPH_USER=horizontal
      - MEMGRAPH_PASSWORD=password

  memgraph-tenant2:
    image: memgraph/memgraph-mage:latest
    volumes:
      - memgraph_tenant2_data:/var/lib/memgraph
    ports:
      - "7688:7687"
      - "7445:7444"
    command: [ "--log-level=TRACE" ]
    environment:
      - MEMGRAPH_USER=horizontal
      - MEMGRAPH_PASSWORD=password

  memgraph-lab:
    image: memgraph/lab:latest
    ports:
      - "9997:3000"
    depends_on:
      memgraph-tenant1:
        condition: service_started
      memgraph-tenant2:
        condition: service_started
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph-tenant1
      - QUICK_CONNECT_MG_PORT=7687

volumes:
  memgraph_tenant1_data:
  memgraph_tenant2_data:

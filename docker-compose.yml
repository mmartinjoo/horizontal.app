services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "9999:8000"
    volumes:
      - ./api:/var/www
      - ./api/storage:/var/www/storage
      - /var/www/vendor  # Anonymous volume for vendor to avoid host conflicts
      - /var/www/node_modules  # Anonymous volume for node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      memgraph:
        condition: service_started
    command: >
      sh -c "
        sleep 30 &&
        composer install &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    deploy:
      replicas: 4
    volumes:
      - ./api:/var/www
      - ./api/storage:/var/www/storage
      - /var/www/vendor
      - /var/www/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      memgraph:
        condition: service_started
    command: >
      sh -c "
        sleep 30 &&
        composer install &&
        php artisan queue:listen
      "

  db:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_DB=horizontal
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "54320:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d horizontal"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

#  frontend:
#    build:
#      context: ./frontend
#      dockerfile: Dockerfile
#    ports:
#      - "51730:5173"
#    volumes:
#      - ./frontend:/app
#      - /app/node_modules
#    environment:
#      - VITE_API_URL=http://localhost:8000
#    depends_on:
#      - api
#
  graphbuilder:
    build:
      context: ./graphbuilder
      dockerfile: Dockerfile
    ports:
      - "9998:9998"
    volumes:
      - ./graphbuilder:/app
    depends_on:
      db:
        condition: service_healthy
      memgraph:
        condition: service_started

  memgraph:
    image: memgraph/memgraph-mage:latest
    volumes:
      - ./memgraph_data:/var/lib/memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    command: [ "--log-level=TRACE", "--schema-info-enabled" ]

  memgraph-lab:
    image: memgraph/lab:latest
    ports:
      - "9997:3000"
    depends_on:
      - memgraph
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687

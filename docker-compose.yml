services:
  proxy:
    image: nginx:1.27.3-alpine
    restart: unless-stopped
    ports:
      - "9996:80"
    volumes:
      - ./proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nginx
      - frontend

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - ./api:/var/www
      - ./api/storage:/var/www/storage
      - /var/www/vendor  # Anonymous volume for vendor to avoid host conflicts
      - /var/www/node_modules  # Anonymous volume for node_modules
    depends_on:
      db:
        condition: service_healthy
      memgraph-tenant1:
        condition: service_started
      memgraph-tenant2:
        condition: service_started
    command: >
      sh -c "
        sleep 10 &&
        composer install &&
        php artisan migrate --force &&
        php-fpm
      "

  nginx:
    image: nginx:1.27.3-alpine
    restart: unless-stopped    
    ports:
      - "9999:80"
    volumes:
      - ./api/docker/nginx.conf:/etc/nginx/nginx.conf
      - ./api:/var/www
    depends_on:
      - api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # environment:
      # - VITE_API_URL=http://tenant2.localhost:9999/api
    depends_on:
      - api

  worker-indexing:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 1
    volumes:
      - ./api:/var/www
      - ./api/storage:/var/www/storage
      - /var/www/vendor
      - /var/www/node_modules
    depends_on:
      db:
        condition: service_healthy
      memgraph-tenant1:
        condition: service_started
      memgraph-tenant2:
        condition: service_started
    command: >
      sh -c "
        sleep 10 &&
        composer install &&
        php artisan queue:listen --timeout=1800 --queue=indexing,default
      "

  worker-default:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./api:/var/www
      - ./api/storage:/var/www/storage
      - /var/www/vendor
      - /var/www/node_modules
    depends_on:
      db:
        condition: service_healthy
      memgraph-tenant1:
        condition: service_started
      memgraph-tenant2:
        condition: service_started
    command: >
      sh -c "
        sleep 10 &&
        composer install &&
        php artisan queue:listen --timeout=1800 --queue=default,indexing
      "

  db:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_DB=horizontal
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "54320:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d horizontal"]
      interval: 10s
      timeout: 5s
      retries: 5

  graphbuilder-api:
    build:
      context: ./graphbuilder
      dockerfile: Dockerfile
      target: api
    ports:
      - "9998:9998"
    volumes:
      - ./graphbuilder:/app
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      memgraph-tenant1:
        condition: service_started
      memgraph-tenant2:
        condition: service_started

  graphbuilder-worker:
    build:
      context: ./graphbuilder
      dockerfile: Dockerfile
      target: worker
    deploy:
      replicas: 1
    restart: unless-stopped
    volumes:
      - ./graphbuilder:/app
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      redis:
        condition: service_healthy
      memgraph-tenant1:
        condition: service_started
      memgraph-tenant2:
        condition: service_started

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "63791:6379"
    volumes:
      - ./redisdata:/data

  memgraph-tenant1:
    image: memgraph/memgraph-mage:latest
    volumes:
      - ./memgraph_tenant1_data:/var/lib/memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    command: [ "--log-level=TRACE" ]
    environment:
      - MEMGRAPH_USER=horizontal
      - MEMGRAPH_PASSWORD=password

  memgraph-tenant2:
    image: memgraph/memgraph-mage:latest
    volumes:
      - ./memgraph_tenant2_data:/var/lib/memgraph
    ports:
      - "7688:7687"
      - "7445:7444"
    command: [ "--log-level=TRACE" ]
    environment:
      - MEMGRAPH_USER=horizontal
      - MEMGRAPH_PASSWORD=password

  memgraph-lab:
    image: memgraph/lab:latest
    ports:
      - "9997:3000"
    depends_on:
      memgraph-tenant1:
        condition: service_started
      memgraph-tenant2:
        condition: service_started
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph-tenant1
      - QUICK_CONNECT_MG_PORT=7687

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_comp_level 4;
    gzip_types text/css application/javascript image/jpeg image/png;
    
    server {
        listen 80;
        server_name ~^(?<subdomain>.+)\.api$ api;

        root /var/www/public;
        index index.php;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        client_max_body_size 100M;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass api:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # Important: Pass the subdomain to Laravel for tenant identification
            fastcgi_param HTTP_HOST $host;
            fastcgi_param SERVER_NAME $host;

            include fastcgi_params;

            fastcgi_buffering off;
            fastcgi_read_timeout 300;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* (\.env|\.git|\.gitignore|composer\.json|composer\.lock|package\.json) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
service: horizontal-test-api

provider:
  name: aws
  region: us-east-1
  environment:
    APP_ENV: production
    SESSION_DRIVER: cookie
    FILESYSTEM_DISK: s3
    AWS_BUCKET: !ImportValue horizontal-shared-infra-SharedStorage-Name
    QUEUE_CONNECTION: sqs
    SQS_QUEUE: ${construct:jobQueue.queueUrl}
    LOG_STDERR_FORMATTER: Bref\Monolog\CloudWatchFormatter
    DB_CONNECTION: pgsql
    DB_HOST: !ImportValue horizontal-shared-infra-Database-Endpoint
    DB_PORT: !ImportValue horizontal-shared-infra-Database-Port
    DB_DATABASE: horizontal
    DB_USERNAME: horizontal
    DB_PASSWORD: !Sub
      - '{{resolve:secretsmanager:${SecretArn}::password}}'
      - SecretArn: !ImportValue horizontal-shared-infra-Database-Secret-ARN

  vpc:
    securityGroupIds:
      - !ImportValue horizontal-shared-infra-LambdaSecurityGroup-ID
    subnetIds:
      - !ImportValue horizontal-shared-infra-PrivateSubnetA-ID
      - !ImportValue horizontal-shared-infra-PrivateSubnetB-ID

  iam:
    role:
      statements:
        - Effect: Allow
          Action: s3:*
          Resource:
            - !ImportValue horizontal-shared-infra-SharedStorage-ARN
            - !Sub
              - '${BucketArn}/*'
              - BucketArn: !ImportValue horizontal-shared-infra-SharedStorage-ARN
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource: !ImportValue horizontal-shared-infra-Database-Secret-ARN

functions:
  web:
    handler: public/index.php
    runtime: php-84-fpm
    timeout: 28
    events:
      - httpApi: '*'

  artisan:
    handler: artisan
    runtime: php-84-console
    timeout: 720

constructs:
  jobQueue:
    type: queue
    worker:
      handler: Bref\LaravelBridge\Queue\QueueHandler
      runtime: php-84
      timeout: 60

custom:
  scripts:
    hooks:
      'after:deploy:deploy': serverless invoke -f artisan --data '"migrate --force"'

package:
  patterns:
    - '!node_modules/**'
    - '!public/storage'
    - '!resources/assets/**'
    - '!resources/css/**'
    - '!resources/images/**'
    - '!resources/js/**'
    - '!storage/**'
    - '!tests/**'
    - '!database/*.sqlite'
    - '!public/build/**'
    - '!.env'
    - '!.env.example'
    - '!.claude'
    - '!.cursor'
    - '!.vscode'
    - '!.junie'
    - '!tasks/**'
    - '!CLAUDE.md'

plugins:
  - ./vendor/bref/bref
  - serverless-lift
  - serverless-plugin-scripts

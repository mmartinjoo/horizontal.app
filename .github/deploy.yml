name: Deploy

on:
  push:
    branches: [ "main", "k8s" ]

jobs:
  build-backend-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build images
        run: |
          docker build -t registry.digitalocean.com/horizontal/api:latest --target=api -f ./api/Dockerfile.prod .
      - name: Push images
        run: |
          docker push registry.digitalocean.com/horizontal/api:latest

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [ "build-backend-images" ]
    steps:
      - uses: actions/checkout@v3
      - name: Install doctl
        run: |
          wget https://github.com/digitalocean/doctl/releases/download/v1.94.0/doctl-1.94.0-linux-amd64.tar.gz
          tar xf ./doctl-1.94.0-linux-amd64.tar.gz
          mv ./doctl /usr/local/bin
          doctl version
          doctl auth init --access-token ${{ secrets.DOCTL_TOKEN }}
          doctl k8s cluster kubeconfig save ${{ secrets.DO_CLUSTER_ID }}
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          curl -LO "https://dl.k8s.io/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          mv ./kubectl /usr/local/bin
          kubectl version --output=yaml
      - name: Prepare secrets
        run: |
          cp k8s/app-secrets.yml.template k8s/app-secrets.yml

          sed -i 's/\$APP_KEY/${{ secrets.APP_KEY }}/' k8s/app-secrets.yml

          sed -i 's/\$DB_HOST/${{ secrets.DB_HOST }}/' k8s/app-secrets.yml
          sed -i 's/\$DB_PORT/${{ secrets.DB_PORT }}/' k8s/app-secrets.yml
          sed -i 's/\$DB_DATABASE/${{ secrets.DB_DATABASE }}/' k8s/app-secrets.yml
          sed -i 's/\$DB_USERNAME/${{ secrets.DB_USERNAME }}/' k8s/app-secrets.yml
          sed -i 's/\$DB_PASSWORD/${{ secrets.DB_PASSWORD }}/' k8s/app-secrets.yml

          sed -i 's/\$REDIS_HOST/${{ secrets.REDIS_HOST }}/' k8s/app-secrets.yml
          sed -i 's/\$REDIS_PASSWORD/${{ secrets.REDIS_PASSWORD }}/' k8s/app-secrets.yml
          sed -i 's/\$REDIS_PORT/${{ secrets.REDIS_PORT }}/' k8s/app-secrets.yml
          sed -i 's/\$REDIS_URL/${{ secrets.REDIS_URL }}/' k8s/app-secrets.yml

          sed -i 's/\$FIREWORKS_API_KEY/${{ secrets.FIREWORKS_API_KEY }}/' k8s/app-secrets.yml
          sed -i 's/\$TOGETHER_API_KEY/${{ secrets.TOGETHER_API_KEY }}/' k8s/app-secrets.yml

          sed -i 's/\$GOOGLE_CHAT_CLIENT_ID/${{ secrets.GOOGLE_CHAT_CLIENT_ID }}/' k8s/app-secrets.yml
          sed -i 's/\$GOOGLE_CHAT_CLIENT_SECRET/${{ secrets.GOOGLE_CHAT_CLIENT_SECRET }}/' k8s/app-secrets.yml
          sed -i 's/\$GOOGLE_CHAT_PROJECT_ID/${{ secrets.GOOGLE_CHAT_PROJECT_ID }}/' k8s/app-secrets.yml

          sed -i 's/\$GOOGLE_DRIVE_CLIENT_ID/${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}/' k8s/app-secrets.yml
          sed -i 's/\$GOOGLE_DRIVE_CLIENT_SECRET/${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}/' k8s/app-secrets.yml
          sed -i 's/\$GOOGLE_DRIVE_PROJECT_ID/${{ secrets.GOOGLE_DRIVE_PROJECT_ID }}/' k8s/app-secrets.yml

          sed -i 's/\$GOOGLE_AUTH_CLIENT_ID/${{ secrets.GOOGLE_AUTH_CLIENT_ID }}/' k8s/app-secrets.yml
          sed -i 's/\$GOOGLE_AUTH_CLIENT_SECRET/${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}/' k8s/app-secrets.yml

          sed -i 's/\$JIRA_APP_ID/${{ secrets.JIRA_APP_ID }}/' k8s/app-secrets.yml
          sed -i 's/\$JIRA_CLIENT_ID/${{ secrets.JIRA_CLIENT_ID }}/' k8s/app-secrets.yml
          sed -i 's/\$JIRA_CLIENT_SECRET/${{ secrets.JIRA_CLIENT_SECRET }}/' k8s/app-secrets.yml

          sed -i 's/\$SLACK_APP_ID/${{ secrets.SLACK_APP_ID }}/' k8s/app-secrets.yml
          sed -i 's/\$SLACK_CLIENT_ID/${{ secrets.SLACK_CLIENT_ID }}/' k8s/app-secrets.yml
          sed -i 's/\$SLACK_CLIENT_SECRET/${{ secrets.SLACK_CLIENT_SECRET }}/' k8s/app-secrets.yml

          sed -i 's/\$LINEAR_CLIENT_ID/${{ secrets.LINEAR_CLIENT_ID }}/' k8s/app-secrets.yml
          sed -i 's/\$LINEAR_CLIENT_SECRET/${{ secrets.LINEAR_CLIENT_SECRET }}/' k8s/app-secrets.yml

          sed -i 's/\$GITHUB_APP_ID/${{ secrets.GITHUB_APP_ID }}/' k8s/app-secrets.yml
          sed -i 's/\$GITHUB_CLIENT_ID/${{ secrets.GITHUB_CLIENT_ID }}/' k8s/app-secrets.yml
          sed -i 's/\$GITHUB_CLIENT_SECRET/${{ secrets.GITHUB_CLIENT_SECRET }}/' k8s/app-secrets.yml
          sed -i 's/\$GITHUB_PRIVATE_KEY/${{ secrets.GITHUB_PRIVATE_KEY }}/' k8s/app-secrets.yml

          sed -i 's/\$GITHUB_AUTH_APP_ID/${{ secrets.GITHUB_AUTH_APP_ID }}/' k8s/app-secrets.yml
          sed -i 's/\$GITHUB_AUTH_CLIENT_ID/${{ secrets.GITHUB_AUTH_CLIENT_ID }}/' k8s/app-secrets.yml
          sed -i 's/\$GITHUB_AUTH_CLIENT_SECRET/${{ secrets.GITHUB_AUTH_CLIENT_SECRET }}/' k8s/app-secrets.yml
          sed -i 's/\$GITHUB_AUTH_PRIVATE_KEY/${{ secrets.GITHUB_AUTH_PRIVATE_KEY }}/' k8s/app-secrets.yml

      - name: Update cluster
        run: |
          kubectl apply -f k8s/api-deployment.yaml

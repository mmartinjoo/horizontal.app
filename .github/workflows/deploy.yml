name: Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install doctl
        run: |
          wget https://github.com/digitalocean/doctl/releases/download/v1.94.0/doctl-1.94.0-linux-amd64.tar.gz
          tar xf ./doctl-1.94.0-linux-amd64.tar.gz
          sudo mv ./doctl /usr/local/bin
          doctl version

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          curl -LO "https://dl.k8s.io/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo mv ./kubectl /usr/local/bin
          kubectl version --client

      - name: Authenticate to DigitalOcean
        run: |
          doctl auth init --access-token ${{ secrets.DOCTL_TOKEN }}
          doctl k8s cluster kubeconfig save ${{ secrets.DO_CLUSTER_ID }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Build Docker images
        run: |
          TAG="${GITHUB_SHA:0:7}"

          docker build -t registry.digitalocean.com/horizontal/api:$TAG \
                       -t registry.digitalocean.com/horizontal/api:latest \
                       --target=api -f ./api/Dockerfile.prod api

          docker build -t registry.digitalocean.com/horizontal/api:worker-$TAG \
                       -t registry.digitalocean.com/horizontal/api:worker-latest \
                       --target=worker -f ./api/Dockerfile.prod api

          docker build -t registry.digitalocean.com/horizontal/graphbuilder:api-$TAG \
                       -t registry.digitalocean.com/horizontal/graphbuilder:api-latest \
                       --target=api -f ./graphbuilder/Dockerfile.prod graphbuilder

          docker build -t registry.digitalocean.com/horizontal/graphbuilder:worker-$TAG \
                       -t registry.digitalocean.com/horizontal/graphbuilder:worker-latest \
                       --target=worker -f ./graphbuilder/Dockerfile.prod graphbuilder

          docker build -t registry.digitalocean.com/horizontal/central-app:$TAG \
                       -t registry.digitalocean.com/horizontal/central-app:latest \
                       -f ./central-app/Dockerfile.prod central-app

          docker build -t registry.digitalocean.com/horizontal/tenant-app:$TAG \
                       -t registry.digitalocean.com/horizontal/tenant-app:latest \
                       -f ./tenant-app/Dockerfile.prod tenant-app

      - name: Push Docker image
        run: |
          TAG="${GITHUB_SHA:0:7}"

          docker push registry.digitalocean.com/horizontal/api:$TAG
          docker push registry.digitalocean.com/horizontal/api:latest
          docker push registry.digitalocean.com/horizontal/api:worker-$TAG
          docker push registry.digitalocean.com/horizontal/api:worker-latest

          docker push registry.digitalocean.com/horizontal/graphbuilder:api-$TAG
          docker push registry.digitalocean.com/horizontal/graphbuilder:api-latest
          docker push registry.digitalocean.com/horizontal/graphbuilder:worker-$TAG
          docker push registry.digitalocean.com/horizontal/graphbuilder:worker-latest

          docker push registry.digitalocean.com/horizontal/central-app:$TAG
          docker push registry.digitalocean.com/horizontal/central-app:latest
          docker push registry.digitalocean.com/horizontal/tenant-app:$TAG
          docker push registry.digitalocean.com/horizontal/tenant-app:latest

      - name: Create AWS Credentials Secret
        run: |
          # this creates a secret YAML configuration on the fly from the GitHub secrets
          # then it applies it using dry-run | apply which is idempotent
          kubectl create secret generic aws-credentials \
            --from-literal=access-key-id='${{ secrets.AWS_SECRETS_MANAGER_ACCESS_KEY_ID }}' \
            --from-literal=secret-access-key='${{ secrets.AWS_SECRETS_MANAGER_ACCESS_KEY_SECRET }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install External Secrets Operator
        run: |
          curl -L https://github.com/helmfile/helmfile/releases/download/v0.157.0/helmfile_0.157.0_linux_amd64.tar.gz | tar xz
          mv helmfile /usr/local/bin/
          cd k8s
          helmfile sync

      - name: Deploy External Secrets Operator Resources
        run: |          
          # Deploy SecretStore and ExternalSecret
          # ESO will automatically sync secrets from AWS Secrets Manager
          kubectl apply -f infra/k8s/aws-secret-store.yaml
          kubectl apply -f infra/k8s/app-external-secret.yaml

          # Wait for ExternalSecret to create the app-secrets Secret
          echo "Waiting for External Secrets to sync from AWS..."
          kubectl wait --for=condition=Ready externalsecret/app-secrets --timeout=60s || true

      - name: Run Database Migrations
        run: |
          kubectl delete job api-migrations --ignore-not-found=true

          kubectl apply -f infra/k8s/api-migration-job.yaml

          # Wait for migration to complete (5 min timeout)
          echo "Running database migrations..."
          if kubectl wait --for=condition=complete job/api-migrations --timeout=180s; then
            echo "✓ Migrations completed successfully"
            kubectl logs job/api-migrations
          else
            echo "✗ Migration failed or timed out"
            kubectl logs job/api-migrations
            exit 1
          fi

      - name: Deploy Application
        run: |
          kubectl apply -f infra/k8s/app-config.yaml

          kubectl apply -f infra/k8s/api-migration-job.yaml

          kubectl apply -f infra/k8s/api-deployment.yaml
          kubectl apply -f infra/k8s/nginx-configmap.yaml
          kubectl apply -f infra/k8s/nginx-deployment.yaml
          kubectl apply -f infra/k8s/workers-deployment.yaml

          kubectl apply -f infra/k8s/graphbuilder-api-deployment.yaml
          kubectl apply -f infra/k8s/graphbuilder-worker-deployment.yaml

          kubectl apply -f infra/k8s/central-app-deployment.yaml
          kubectl apply -f infra/k8s/tenant-app-deployment.yaml

          kubectl apply -f infra/k8s/api-hpa.yaml
          kubectl apply -f infra/k8s/worker-indexing-hpa.yaml
          kubectl apply -f infra/k8s/worker-question-hpa.yaml
          kubectl apply -f infra/k8s/worker-default-hpa.yaml
          kubectl apply -f infra/k8s/graphbuilder-api-hpa.yaml
          kubectl apply -f infra/k8s/graphbuilder-worker-hpa.yaml

      - name: Deploy Ingress Rules
        run: |
          #kubectl apply -f infra/k8s/letsencrypt-issuer.yaml

          kubectl apply -f infra/k8s/ingress.yaml

          echo "Waiting for load balancer IP..."
          kubectl get svc -n ingress-nginx ingress-nginx-controller

      - name: Update Deployment Images
        run: |
          TAG="${GITHUB_SHA:0:7}"

          # This forces Kubernetes to pull new images
          kubectl set image deployment/api api=registry.digitalocean.com/horizontal/api:$TAG
          kubectl set image deployment/worker-indexing worker=registry.digitalocean.com/horizontal/api:worker-$TAG
          kubectl set image deployment/worker-question worker=registry.digitalocean.com/horizontal/api:worker-$TAG
          kubectl set image deployment/worker-default worker=registry.digitalocean.com/horizontal/api:worker-$TAG

          kubectl set image deployment/graphbuilder-api graphbuilder-api=registry.digitalocean.com/horizontal/graphbuilder:api-$TAG
          kubectl set image deployment/graphbuilder-worker graphbuilder-worker=registry.digitalocean.com/horizontal/graphbuilder:worker-$TAG

          kubectl set image deployment/central-app central-app=registry.digitalocean.com/horizontal/central-app-$TAG
          kubectl set image deployment/tenant-app tenant-app=registry.digitalocean.com/horizontal/tenant-app-$TAG

          # Wait for rollout to complete
          kubectl rollout status deployment/api
          kubectl rollout status deployment/worker-indexing
          kubectl rollout status deployment/worker-question
          kubectl rollout status deployment/worker-default
          kubectl rollout status deployment/graphbuilder-api
          kubectl rollout status deployment/graphbuilder-worker

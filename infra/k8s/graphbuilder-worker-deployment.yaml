apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphbuilder-worker
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: graphbuilder-worker
  template:
    metadata:
      labels:
        app: graphbuilder-worker
    spec:
      terminationGracePeriodSeconds: 300 # to avoid killing jobs while running
      nodeSelector:
        doks.digitalocean.com/node-pool: worker-pool
      containers:
      - name: graphbuilder-worker
        image: registry.digitalocean.com/horizontal/graphbuilder:worker-latest
        imagePullPolicy: Always
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        env:
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_URL
        - name: QUEUES
          value: "high,default,low"
        - name: LOG_LEVEL
          value: "info"
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - rq info || exit 1
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

# ExternalSecret for Application Secrets
# This syncs secrets from AWS Secrets Manager to a Kubernetes Secret named 'app-secrets'
#
# Prerequisites:
# 1. SecretStore configured (k8s/aws-secret-store.yaml)
# 2. Secrets created in AWS Secrets Manager (see docs/aws-secrets-manager-setup.md)
#
# To apply:
#   kubectl apply -f k8s/app-external-secret.yaml
#
# To verify:
#   kubectl get externalsecret app-secrets
#   kubectl describe externalsecret app-secrets
#   kubectl get secret app-secrets  # This is the generated K8s secret

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: default
spec:
  refreshInterval: 1h  # Sync from AWS every hour
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: app-secrets  # Name of the Kubernetes Secret to create
    creationPolicy: Owner
  data:
  - secretKey: APP_KEY
    remoteRef:
      key: horizontal/prod/app
      property: Key

  - secretKey: MAIL_PASSWORD
    remoteRef:
      key: horizontal/prod/mail
      property: Password

  # Database
  - secretKey: DB_HOST
    remoteRef:
      key: horizontal/prod/database
      property: Host
  - secretKey: DB_PORT
    remoteRef:
      key: horizontal/prod/database
      property: Port
  - secretKey: DB_DATABASE
    remoteRef:
      key: horizontal/prod/database
      property: Database
  - secretKey: DB_USERNAME
    remoteRef:
      key: horizontal/prod/database
      property: Username
  - secretKey: DB_PASSWORD
    remoteRef:
      key: horizontal/prod/database
      property: Password

  # Redis
  - secretKey: REDIS_URL
    remoteRef:
      key: horizontal/prod/redis
      property: Url
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: horizontal/prod/redis
      property: Password

  # LLM Providers
  - secretKey: FIREWORKS_API_KEY
    remoteRef:
      key: horizontal/prod/fireworks
      property: ApiKey
  - secretKey: TOGETHER_API_KEY
    remoteRef:
      key: horizontal/prod/together
      property: ApiKey

  # Google Chat Integration
  - secretKey: GOOGLE_CHAT_CLIENT_ID
    remoteRef:
      key: horizontal/prod/google-chat
      property: ClientID
  - secretKey: GOOGLE_CHAT_CLIENT_SECRET
    remoteRef:
      key: horizontal/prod/google-chat
      property: ClientSecret
  - secretKey: GOOGLE_CHAT_PROJECT_ID
    remoteRef:
      key: horizontal/prod/google-chat
      property: ProjectID

  # Google Drive Integration
  - secretKey: GOOGLE_DRIVE_CLIENT_ID
    remoteRef:
      key: horizontal/prod/google-drive
      property: ClientID
  - secretKey: GOOGLE_DRIVE_CLIENT_SECRET
    remoteRef:
      key: horizontal/prod/google-drive
      property: ClientSecret
  - secretKey: GOOGLE_DRIVE_PROJECT_ID
    remoteRef:
      key: horizontal/prod/google-drive
      property: ProjectID

  # Google Auth
  - secretKey: GOOGLE_AUTH_CLIENT_ID
    remoteRef:
      key: horizontal/prod/google-auth
      property: ClientID
  - secretKey: GOOGLE_AUTH_CLIENT_SECRET
    remoteRef:
      key: horizontal/prod/google-auth
      property: ClientSecret

  # Jira Integration
  - secretKey: JIRA_APP_ID
    remoteRef:
      key: horizontal/prod/jira
      property: AppID
  - secretKey: JIRA_CLIENT_ID
    remoteRef:
      key: horizontal/prod/jira
      property: ClientID
  - secretKey: JIRA_CLIENT_SECRET
    remoteRef:
      key: horizontal/prod/jira
      property: ClientSecret

  # Slack Integration
  - secretKey: SLACK_APP_ID
    remoteRef:
      key: horizontal/prod/slack
      property: AppID
  - secretKey: SLACK_CLIENT_ID
    remoteRef:
      key: horizontal/prod/slack
      property: ClientID
  - secretKey: SLACK_CLIENT_SECRET
    remoteRef:
      key: horizontal/prod/slack
      property: ClientSecret

  # Linear Integration
  - secretKey: LINEAR_CLIENT_ID
    remoteRef:
      key: horizontal/prod/linear
      property: ClientID
  - secretKey: LINEAR_CLIENT_SECRET
    remoteRef:
      key: horizontal/prod/linear
      property: ClientSecret

  # GitHub Integration
  - secretKey: GITHUB_APP_ID
    remoteRef:
      key: horizontal/prod/github
      property: AppID
  - secretKey: GITHUB_CLIENT_ID
    remoteRef:
      key: horizontal/prod/github
      property: ClientID
  - secretKey: GITHUB_CLIENT_SECRET
    remoteRef:
      key: horizontal/prod/github
      property: ClientSecret
  - secretKey: GITHUB_PRIVATE_KEY
    remoteRef:
      key: horizontal/prod/github
      property: PrivateKey

  # GitHub Auth (separate app)
  - secretKey: GITHUB_AUTH_APP_ID
    remoteRef:
      key: horizontal/prod/github-auth
      property: AppID
  - secretKey: GITHUB_AUTH_CLIENT_ID
    remoteRef:
      key: horizontal/prod/github-auth
      property: ClientID
  - secretKey: GITHUB_AUTH_CLIENT_SECRET
    remoteRef:
      key: horizontal/prod/github-auth
      property: ClientSecret
  - secretKey: GITHUB_AUTH_PRIVATE_KEY
    remoteRef:
      key: horizontal/prod/github-auth
      property: PrivateKey

  # service communication tokens
  - secretKey: HORIZONTAL_API_TOKEN
    remoteRef:
      key: horizontal/prod/service-tokens
      property: ApiToken
  - secretKey: GRAPH_BUILDER_API_TOKEN
    remoteRef:
      key: horizontal/prod/service-tokens
      property: ApiToken

apiVersion: v1
kind: Service
metadata:
  name: graphbuilder-api
  labels:
    app: graphbuilder-api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: graphbuilder-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphbuilder-api
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: graphbuilder-api
  template:
    metadata:
      labels:
        app: graphbuilder-api
    spec:
      nodeSelector:
        doks.digitalocean.com/node-pool: app-pool
      containers:
      - name: graphbuilder-api
        image: registry.digitalocean.com/horizontal/graphbuilder:api-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        env:
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_URL
        - name: APP_PORT
          value: "80"
        - name: WEB_CONCURRENCY
          value: "1"
        - name: LOG_LEVEL
          value: "info"
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        startupProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readiness
            port: 80
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

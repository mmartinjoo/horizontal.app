apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-indexing-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: worker-indexing
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 10  # Check queue every 10 seconds
  cooldownPeriod: 30   # Wait 30s before scaling down
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 30
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60  # Max 1 pod down per minute
        scaleUp:
          stabilizationWindowSeconds: 10
          policies:
            - type: Pods
              value: 2
              periodSeconds: 30  # Max 2 pods up per 30s
            - type: Percent
              value: 50
              periodSeconds: 30  # Or 50% increase
          selectPolicy: Max
  triggers:
    - type: redis
      metadata:
        address: redis-14547.c55.eu-central-1-1.ec2.cloud.redislabs.com:14547
        username: default
        databaseIndex: "0"
        listName: horizontal-database-api-queue-size
        listLength: "2"  # Target 2 jobs per replica
        activationListLength: "1"  # Scale from 0 to 1 when 1+ jobs exist
        enableTLS: "false"
      authenticationRef:
        name: redis-trigger-auth
# Helmfile - Declarative Helm Chart Management
# Install helmfile: https://github.com/helmfile/helmfile
#
# Usage:
#   helmfile sync    # Install/upgrade all releases
#   helmfile diff    # Show what would change
#   helmfile list    # List all releases

repositories:
  - name: external-secrets
    url: https://charts.external-secrets.io
  - name: metrics-server
    url: https://kubernetes-sigs.github.io/metrics-server/
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: jetstack
    url: https://charts.jetstack.io

releases:
  - name: external-secrets
    namespace: external-secrets
    createNamespace: true
    chart: external-secrets/external-secrets
    version: 1.1.0
    values:
      - installCRDs: true
      - replicaCount: 1
      - resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi

  - name: metrics-server
    namespace: kube-system
    chart: metrics-server/metrics-server
    version: 3.12.1
    values:
      - args:
          - --kubelet-preferred-address-types=InternalIP
          - --kubelet-insecure-tls
      - resources:
          requests:
            cpu: 100m
            memory: 48Mi
          limits:
            cpu: 200m
            memory: 400Mi

  - name: ingress-nginx
    namespace: ingress-nginx
    createNamespace: true
    chart: ingress-nginx/ingress-nginx
    version: 4.11.3
    values:
      - controller:
          service:
            type: LoadBalancer
            annotations:
              # DigitalOcean-specific annotations
              service.beta.kubernetes.io/do-loadbalancer-name: "horizontal-lb"
              service.beta.kubernetes.io/do-loadbalancer-protocol: "http"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          metrics:
            enabled: true
          replicaCount: 2

  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: jetstack/cert-manager
    version: v1.16.2
    values:
      - installCRDs: true
      - global:
          leaderElection:
            namespace: cert-manager
      - resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
      - webhook:
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      - cainjector:
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi

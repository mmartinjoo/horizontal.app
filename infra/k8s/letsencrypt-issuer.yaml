# Let's Encrypt Production ClusterIssuer
# Configures cert-manager to use Let's Encrypt for certificate issuance
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt Production server
    # Rate limits: 50 certificates per domain per week
    server: https://acme-v02.api.letsencrypt.org/directory

    # Email for certificate expiration notifications
    email: hello@horizontal.app

    # Secret to store ACME account private key
    privateKeySecretRef:
      name: letsencrypt-prod-account-key

    # Certificate challenge solvers
    solvers:
    # DNS-01 solver for wildcard certificates (*.horizontal.app)
    - selector:
        dnsNames:
        - "*.horizontal.app"
      dns01:
        digitalocean:
          tokenSecretRef:
            name: digitalocean-dns
            key: access-token

    # HTTP-01 solver for non-wildcard domains
    - http01:
      ingress:
        class: nginx
        podTemplate:
          spec:
            nodeSelector:
              doks.digitalocean.com/node-pool: app-pool

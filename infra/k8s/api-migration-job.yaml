apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrations
  labels:
    app: api-migrations
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: api-migrations
    spec:
      restartPolicy: Never
      nodeSelector:
        doks.digitalocean.com/node-pool: app-pool
      containers:
      - name: migrations
        image: registry.digitalocean.com/horizontal/api:latest
        command:
          - sh
          - -c
          - |
            set -e
            php artisan migrate --force
            php artisan tenants:migrate --force
            echo 'All migrations completed successfully'
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets

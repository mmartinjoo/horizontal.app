# Root domain: horizontal.app
# Routes landing page and tenant-agnostic API
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: horizontal-root
  annotations:
    # Enable SSL redirect to force HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Use cert-manager to issue certificate
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Force HTTPS on all requests
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - horizontal.app
    secretName: horizontal-app-tls
  rules:
  - host: horizontal.app
    http:
      paths:
      # API routes (must come before / to avoid being caught by landing page)
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: nginx
            port:
              number: 80

      # Landing page (catch-all for everything else)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: central-app
            port:
              number: 80

---
# Tenant subdomains: *.horizontal.app
# Routes tenant-specific apps and APIs
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: horizontal-tenants
  annotations:
    # Enable SSL redirect to force HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Use cert-manager to issue certificate
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Force HTTPS on all requests
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - "*.horizontal.app"
    secretName: horizontal-tenants-tls
  rules:
  - host: "*.horizontal.app"
    http:
      paths:
      # Laravel API (tenant-specific routes)
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: nginx
            port:
              number: 80

      # Vue tenant app (catch-all with SPA support)
      # All non-API routes serve the Vue app, which handles client-side routing
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tenant-app
            port:
              number: 80

# External Secrets Operator - RBAC Fix
#
# This fixes a bug in the upstream Helm chart (v1.1.0) where the ClusterRole
# is missing "update" and "patch" permissions on the "externalsecrets" resource.
# Without these permissions, ESO cannot update ExternalSecret resources to set
# finalizers, which prevents secret synchronization from working.
#
# Apply after installing with Helm/Helmfile:
#   kubectl apply -f k8s/external-secrets-rbac-fix.yaml
#
# This file can be deleted once the upstream chart fixes this issue.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-controller
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: external-secrets
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["external-secrets.io"]
  resources: ["secretstores", "clustersecretstores", "externalsecrets"]
  verbs: ["get", "list", "watch", "update", "patch"]  # ← Fixed: added "update", "patch"
- apiGroups: ["external-secrets.io"]
  resources: ["externalsecrets/status", "externalsecrets/finalizers"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["external-secrets.io"]
  resources: ["secretstores/status", "clustersecretstores/status"]
  verbs: ["get", "update", "patch"]

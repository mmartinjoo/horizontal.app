# AWS Secrets Manager SecretStore
# This configures External Secrets Operator to connect to AWS Secrets Manager
#
# Prerequisites:
# 1. External Secrets Operator installed (k8s/external-secrets-operator.yaml)
# 2. AWS credentials secret created (k8s/aws-credentials-secret.yaml)
#
# To apply:
#   kubectl apply -f k8s/aws-secret-store.yaml
#
# To verify:
#   kubectl get secretstore aws-secrets-manager
#   kubectl describe secretstore aws-secrets-manager

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1  # Change to your AWS region
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key

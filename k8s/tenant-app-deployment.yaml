apiVersion: v1
kind: Service
metadata:
  name: tenant-app
  labels:
    app: tenant-app
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: tenant-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tenant-app
  template:
    metadata:
      labels:
        app: tenant-app
    spec:
      nodeSelector:
        doks.digitalocean.com/node-pool: app-pool
      containers:
      - name: tenant-app
        image: your-registry/horizontal-tenant-app:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphbuilder-worker
spec:
  replicas: 4
  selector:
    matchLabels:
      app: graphbuilder-worker
  template:
    metadata:
      labels:
        app: graphbuilder-worker
    spec:
      containers:
      - name: graphbuilder-worker
        image: your-registry/horizontal-graphbuilder-worker:latest
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        env:
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_URL
        - name: QUEUES
          value: "high,default,low"
        - name: LOG_LEVEL
          value: "info"
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pgrep -f "rq worker" || exit 1
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

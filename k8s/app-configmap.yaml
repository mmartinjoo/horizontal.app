apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Application
  APP_NAME: "Horizontal"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_LOCALE: "en"
  APP_FALLBACK_LOCALE: "en"
  APP_FAKER_LOCALE: "en_US"
  APP_MAINTENANCE_DRIVER: "file"

  # PHP Configuration
  PHP_CLI_SERVER_WORKERS: "4"
  BCRYPT_ROUNDS: "12"

  # Logging
  LOG_CHANNEL: "stack"
  LOG_STACK: "single,daily,stderr,slack"
  LOG_DEPRECATIONS_CHANNEL: "null"
  LOG_LEVEL: "info"
  LOG_SLACK_LEVEL: "error"

  # Database
  DB_CONNECTION: "central"

  # Redis
  REDIS_CLIENT: "phpredis"

  # Session
  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  SESSION_PATH: "/"

  # Queue & Cache
  BROADCAST_CONNECTION: "log"
  FILESYSTEM_DISK: "local"
  QUEUE_CONNECTION: "redis"
  CACHE_STORE: "redis"

  # Mail
  MAIL_MAILER: "log"
  MAIL_HOST: "127.0.0.1"
  MAIL_PORT: "2525"
  MAIL_FROM_ADDRESS: "hello@example.com"
  MAIL_FROM_NAME: "Horizontal"

  # LLM
  LLM_PROVIDER: "fireworks"
  LLM_MODEL: "accounts/fireworks/models/deepseek-v3p1-terminus"

  # Graph Database
  GRAPH_DB_CONNECTION: "memgraph"
  GRAPH_DB_SCHEME: "none"

  # Google OAuth URLs
  GOOGLE_AUTH_URI: "https://accounts.google.com/o/oauth2/auth"
  GOOGLE_TOKEN_URI: "https://oauth2.googleapis.com/token"
  GOOGLE_AUTH_PROVIDER_X509_CERT_URL: "https://www.googleapis.com/oauth2/v1/certs"
  GOOGLE_REDIRECT_URI: "/api/integrations/google/oauth/callback"

  # Jira
  JIRA_APP_ID: "4047bb57-10d3-413b-bdf2-52125a5f4844"
  JIRA_CLIENT_ID: "bqM6QTIyfokyhUItThGrERbeyz26aJqD"
  JIRA_REDIRECT_URI: "https://your-domain.com/api/integrations/jira/oauth/callback"

  # Linear
  LINEAR_REDIRECT_URL: "https://your-domain.com/api/integrations/linear/oauth/callback"

  # GitHub
  GITHUB_BASE_URL: "https://api.github.com/"
  GITHUB_APP_NAME: "your-github-app-name"

  # Search Configuration
  SEARCH_ENGINE_COSINE_SIMILARITY_THRESHOLD: "0.45"

  # GraphBuilder
  GRAPH_BUILDER_BASE_URL: "http://graphbuilder-api:9998"

  # Supervisor
  SUPERVISOR_TIMEOUT: "60"
  SUPERVISOR_INTERVAL: "5"
  SUPERVISOR_STUCK_BUCKET_INTERVAL: "1800"
  SUPERVISOR_STUCK_ITEM_INTERVAL: "900"
